[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-fichiers"
version = "0.2.0"
description = "Atelier local de conversion d’images et d’assemblage PDF pour Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11.3,<14",
  "pypdf>=6,<7",
  "img2pdf>=0.6,<0.7",
  "pypdfium2>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[project.gui-scripts]
atelier = "atelier.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atelier = ["assets/*.svg", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["atelier"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["img2pdf", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
